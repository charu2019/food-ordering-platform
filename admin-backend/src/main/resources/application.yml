spring:
  application:
    name: admin-backend
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/foodordering
    username: ${DB_USER:fooduser}
    password: ${DB_PASS:foodpass123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3

app:
  jwt:
    secret: ${JWT_SECRET:EPtkIyG6WMD8wu/cmJY3Dfz+Y5vEq6v2v+NlYfw4L74=}
    expiration: 86400000
  
  kafka:
    topics:
      order-status: order-status-events
  
  cors:
    allowed-origins: http://localhost:3001,http://localhost:5174
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true

server:
  port: 8081
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    com.foodordering.admin: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
logging:
  level:
    com.foodordering.admin: INFO
    org.springframework.security: WARN
